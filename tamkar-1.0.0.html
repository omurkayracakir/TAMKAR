<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sports Takım Karıştırıcı</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #00e676;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --team-1: #3b82f6;
            --team-2: #f43f5e;
            --team-3: #eab308;
            --team-4: #a855f7;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background-color 0.3s; }

        /* HEADER & MENÜ */
        .header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: 0.2s; width: 250px; }
        .logo:hover { text-shadow: 0 0 10px var(--accent); }
        
        /* TEMA SEÇİCİ */
        .theme-switcher { display: flex; gap: 10px; justify-content: center; flex: 1; }
        .theme-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .theme-dot:hover { transform: scale(1.3); }

        .nav-modes { display: flex; gap: 10px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 8px; transition: opacity 0.3s; justify-content: flex-end; width: auto; }
        .mode-btn { background: transparent; color: var(--text-muted); border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; font-size: 13px; }
        .mode-btn.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        .mode-btn:hover:not(.active) { color: var(--text-main); background: rgba(255,255,255,0.05); }

        /* ANA KONTEYNER */
        .container { max-width: 1300px; margin: 40px auto; padding: 0 20px; width: 100%; flex: 1; }
        
        /* GİRİŞ EKRANI */
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .panel { background: var(--panel-bg); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .panel h2 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; font-size: 20px; color: var(--accent); border-bottom: 2px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        
        .row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; transition: transform 0.2s; }
        .row:hover { transform: scale(1.015); }
        .input-text { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; outline: none; }
        .btn-icon { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: none; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; transition: 0.2s; }
        .btn-icon:hover { background: var(--danger); color: white; }
        
        /* ÖZEL SEVİYE KUTUCUKLARI (1-10) */
        .rating-dots { display: flex; gap: 4px; }
        .rating-box { width: 22px; height: 22px; border-radius: 4px; background: rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: var(--text-muted); user-select: none; border: 1px solid rgba(255,255,255,0.1); }
        .rating-box.active { color: #000; border-color: transparent; }

        .btn-add { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 2px dashed rgba(255,255,255,0.2); color: var(--text-muted); font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-add:hover { background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.4); }

        .start-btn { display: block; width: 100%; max-width: 400px; margin: 40px auto; padding: 20px; background: var(--accent); border: none; border-radius: 30px; font-size: 20px; font-weight: 800; color: #000; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.2s, box-shadow 0.2s; }
        .start-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px var(--accent); }
        .start-btn:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 20px; color: var(--text-muted); cursor: pointer; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }

        /* ÇARKIFELEK & ZAR ORTAK */
        .stage-screen { display: none; text-align: center; }
        .stage-title { font-size: 32px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* ÇARKIFELEK */
        .wheel-container { position: relative; width: 450px; height: 450px; margin: 0 auto 30px auto; }
        .wheel-pointer { position: absolute; top: 50%; right: -10px; transform: translateY(-50%); border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-right: 35px solid #fff; z-index: 10; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); transform-origin: right center; transition: transform 0.05s ease-out; }
        .wheel-pointer.tick { transform: translateY(-50%) rotate(-25deg); }
        
        /* ZAR MODU */
        .dice-layout { display: flex; flex-direction: column; gap: 40px; margin-top: 20px; align-items: center; }
        .table-zone { background: radial-gradient(circle, #2a3b2c 0%, #0f172a 70%); border: 3px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; max-width: 600px; }
        
        /* 3D ZAR */
        .scene { width: 120px; height: 120px; perspective: 600px; margin: 20px 0; }
        .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: translateZ(-60px); transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .cube.rolling { animation: throwCube 1s ease-out forwards; }
        
        .cube-face { position: absolute; width: 120px; height: 120px; background: white; border: 2px solid #ccc; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: bold; color: #1e293b; box-shadow: inset 0 0 15px rgba(0,0,0,0.2); text-align: center; padding: 5px; word-wrap: break-word; }
        
        .front  { transform: rotateY(  0deg) translateZ(60px); }
        .right  { transform: rotateY( 90deg) translateZ(60px); }
        .back   { transform: rotateY(180deg) translateZ(60px); }
        .left   { transform: rotateY(-90deg) translateZ(60px); }
        .top    { transform: rotateX( 90deg) translateZ(60px); }
        .bottom { transform: rotateX(-90deg) translateZ(60px); }

        @keyframes spinCube {
            0% { transform: translateZ(-60px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: translateZ(-60px) rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
        }

        @keyframes throwCube {
            0% { transform: translate3d(-150px, -200px, -100px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            25% { transform: translate3d(-50px, 30px, -50px) rotateX(180deg) rotateY(180deg) rotateZ(90deg); }
            50% { transform: translate3d(20px, -80px, 20px) rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
            75% { transform: translate3d(50px, 10px, 50px) rotateX(540deg) rotateY(450deg) rotateZ(270deg); }
            100% { transform: translate3d(0px, 0px, -60px) rotateX(720deg) rotateY(630deg) rotateZ(360deg); }
        }

        /* CANLI TAKIMLAR / SONUÇ EKRANI */
        .teams-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; width: 100%; }
        .team-card { background: var(--panel-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.4); border-top: 4px solid var(--accent); text-align: left; }
        .team-header { background: rgba(0,0,0,0.2); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .team-header h3 { margin: 0; color: #fff; }
        .team-stats { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px; }
        .team-members { list-style: none; padding: 0; margin: 0; }
        .team-members li { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.5s ease; }
        .team-members li:last-child { border-bottom: none; }
        .p-rating { font-weight: 800; font-size: 14px; text-shadow: 0 0 5px rgba(0,0,0,0.5); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* LIGHT MODE EKLENTİSİ */
        body.light-mode {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
        }
        body.light-mode .header { background: rgba(255, 255, 255, 0.8); border-bottom-color: rgba(0,0,0,0.1); }
        body.light-mode .nav-modes { background: rgba(0,0,0,0.05); }
        body.light-mode .mode-btn:hover:not(.active) { background: rgba(0,0,0,0.05); }
        body.light-mode .panel { border-color: rgba(0,0,0,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        body.light-mode .panel h2 { border-bottom-color: rgba(0,0,0,0.05); }
        body.light-mode .row { background: rgba(0,0,0,0.03); }
        body.light-mode .rating-box { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.1); }
        body.light-mode .btn-add { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.2); }
        body.light-mode .btn-add:hover { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.4); }
        body.light-mode .team-header { background: rgba(0,0,0,0.05); }
        body.light-mode .team-header h3 { color: var(--text-main); }
        body.light-mode .team-stats { background: rgba(0,0,0,0.05); color: var(--text-muted); }
        body.light-mode .team-members li { border-bottom-color: rgba(0,0,0,0.05); }
        body.light-mode .table-zone { background: radial-gradient(circle, #cbd5e1 0%, #f8fafc 70%); border-color: rgba(0,0,0,0.1); }
        body.light-mode .wheel-pointer { border-right-color: var(--text-main); }
        body.light-mode .theme-divider { background: rgba(0,0,0,0.2) !important; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo" id="logo-text" onclick="resetToMenu()" title="Ayar Ekranına Dön">Beceriye Göre</div>
        
        <!-- Renk / Tema Seçici -->
        <div class="theme-switcher" id="theme-switcher">
            <div class="theme-dot" style="background: #00e676;" onclick="changeTheme('#00e676')"></div> <!-- Yeşil -->
            <div class="theme-dot" style="background: #3b82f6;" onclick="changeTheme('#3b82f6')"></div> <!-- Mavi -->
            <div class="theme-dot" style="background: #a855f7;" onclick="changeTheme('#a855f7')"></div> <!-- Mor -->
            <div class="theme-dot" style="background: #ef4444;" onclick="changeTheme('#ef4444')"></div> <!-- Kırmızı -->
            <div class="theme-dot" style="background: #f97316;" onclick="changeTheme('#f97316')"></div> <!-- Turuncu -->
            
            <div class="theme-divider" style="width: 2px; height: 22px; background: rgba(255,255,255,0.2); margin: 0 5px;"></div>
            <button id="darkModeToggle" onclick="toggleDarkMode()" style="background: transparent; border: none; color: var(--text-main); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 0; transition: 0.3s; margin-top:-2px;" title="Gece/Gündüz Modu">☀️</button>
        </div>

        <div class="nav-modes" id="nav-modes">
            <button class="mode-btn" id="btnNormal" onclick="setMode('normal')">Hızlı (Rastgele)</button>
            <button class="mode-btn active" id="btnSkill" onclick="setMode('skill')">Beceriye Göre</button>
            <button class="mode-btn" id="btnWheel" onclick="setMode('wheel')">Çarkıfelek</button>
            <button class="mode-btn" id="btnDice" onclick="setMode('dice')">Zar Masası</button>
            <button class="mode-btn" id="btnRoulette" onclick="setMode('roulette')">Rulet</button>
        </div>
    </div>

    <div class="container" id="main-inputs">
        <div class="setup-grid">
            <!-- Sol: Katılımcılar -->
            <div class="panel">
                <h2>Katılımcılar <span id="playerCount" style="font-size:14px; background: rgba(255,255,255,0.1); color:var(--accent); padding:2px 8px; border-radius:10px;">0</span></h2>
                <div id="participants-list"></div>
                <button class="btn-add" onclick="addParticipant()">+ Yeni Oyuncu Ekle</button>
            </div>

            <!-- Sağ: Takımlar -->
            <div class="panel">
                <h2>Takımlar <span id="teamCountBadge" style="font-size:14px; background: rgba(255,255,255,0.1); color:var(--accent); padding:2px 8px; border-radius:10px;">0</span></h2>
                <div id="teams-list"></div>
                <button class="btn-add" onclick="addTeam()">+ Yeni Takım Ekle</button>
            </div>
        </div>
        
        <label class="checkbox-group" id="forceEqualContainer">
            <input type="checkbox" id="forceEqual" checked>
            Eşit Oyuncu Sayısına Zorla (Örn: 5v5 Dağılım)
        </label>

        <button class="start-btn" onclick="startGeneration()">Eşleştirmeyi Başlat</button>
    </div>

    <!-- ÇARKIFELEK EKRANI -->
    <div class="container stage-screen" id="wheel-screen">
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px;">
            <span id="wheel-status-text">Sıradaki Takım:</span>
            <select id="wheel-team-select" style="font-size: 20px; padding: 5px 15px; background: var(--panel-bg); color: var(--text-main); border: 2px solid var(--accent); border-radius: 8px; outline: none; cursor: pointer; font-weight: bold; display: none;"></select>
        </div>
        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <canvas id="wheel-canvas" width="450" height="450"></canvas>
        </div>
        <button class="start-btn" id="spinBtn" style="margin-top:0;" onclick="spinWheel()">Çarkı Çevir</button>
        <div id="wheel-teams-grid" class="teams-grid"></div>
    </div>

    <!-- ZAR EKRANI -->
    <div class="container stage-screen" id="dice-screen">
        <div class="stage-title" style="color:var(--accent);">Zar Masası</div>
        
        <div class="dice-layout">
            <div class="table-zone">
                <div style="font-size: 24px; font-weight: bold; margin-bottom: -10px; display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 10;">
                    <span id="dice-status-text">Sıradaki:</span>
                    <select id="dice-player-select" style="font-size: 20px; padding: 5px 15px; background: var(--panel-bg); color: var(--text-main); border: 2px solid var(--accent); border-radius: 8px; outline: none; cursor: pointer; font-weight: bold; display: none;"></select>
                </div>
                
                <div class="scene">
                    <div class="cube" id="dice-cube">
                        <div class="cube-face front" id="face-0">T1</div>
                        <div class="cube-face back" id="face-5">T2</div>
                        <div class="cube-face right" id="face-2">T1</div>
                        <div class="cube-face left" id="face-3">T2</div>
                        <div class="cube-face top" id="face-1">T1</div>
                        <div class="cube-face bottom" id="face-4">T2</div>
                    </div>
                </div>
                
                <button class="start-btn" id="dice-roll-btn" style="margin: 0; padding: 15px 40px; font-size:18px;" onclick="rollDice()">Zarı At</button>
            </div>

            <div id="dice-teams-grid" class="teams-grid"></div>
        </div>
    </div>

    <!-- RULET EKRANI -->
    <div class="container stage-screen" id="roulette-screen">
        <div class="stage-title" style="color:var(--accent);">Rulet Masası</div>
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px;">
            <span id="roulette-status-text">Sıradaki:</span>
            <select id="roulette-player-select" style="font-size: 20px; padding: 5px 15px; background: var(--panel-bg); color: var(--text-main); border: 2px solid var(--accent); border-radius: 8px; outline: none; cursor: pointer; font-weight: bold; display: none;"></select>
        </div>
        
        <div class="wheel-container" style="width:400px; height:400px; margin: 0 auto 20px auto; border-radius:50%; border: 12px solid #33201c; box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 25px rgba(0,0,0,0.9); background: #0a0a0a;">
            <canvas id="roulette-canvas" width="376" height="376" style="border-radius:50%;"></canvas>
        </div>
        
        <div id="roulette-controls" style="margin-top: 10px;">
            <button class="start-btn" id="roulette-roll-btn" style="margin: 0 auto; padding: 15px 40px; font-size:18px; text-transform:none;" onclick="spinRoulette()">Çevir</button>
        </div>
        
        <div id="roulette-choice" style="display:none; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 30px;">
            <!-- Takım Seçim Butonları Buraya Gelecek -->
        </div>
        
        <div id="roulette-teams-grid" class="teams-grid"></div>
    </div>

    <!-- HIZLI SONUÇ EKRANI -->
    <div class="container stage-screen" id="results-screen">
        <div class="stage-title" style="color:var(--accent);">Kadro Tamamlandı!</div>
        <div id="final-teams-grid" class="teams-grid"></div>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 40px;">
            <button class="start-btn" onclick="startGeneration()" style="margin: 0; width: 100%; max-width: 300px; background:var(--accent); color:#000;">Yeniden Karıştır</button>
            <button class="start-btn" onclick="resetToMenu()" style="margin: 0; width: 100%; max-width: 300px; background:var(--panel-bg); color:var(--text-main); border: 1px solid rgba(150,150,150,0.3); box-shadow:none;">Menüye Dön</button>
        </div>
    </div>

    <script>
        let mode = 'skill'; 
        let participants = [];
        let teams = [];
        
        let draftPlayers = [];
        let draftTeams = [];
        let currentTeamIndex = 0;
        let isAnimating = false;
        
        let activeRoulettePlayerIndex = 0;
        let activeDicePlayerIndex = 0;
        let activeWheelMode = 'auto';

        // Global Ses ve Efekt Tanımlamaları
        const sfxDice = new Audio('https://actions.google.com/sounds/v1/foley/rolling_dice.ogg');
        const sfxRoulette = new Audio('https://actions.google.com/sounds/v1/sports/bowling_ball_roll.ogg');
        let audioCtx = null;
        let lastTick = 0;

        function initAudio() {
            if(!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if(AC) audioCtx = new AC();
            }
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTick() {
            if(!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
                
                const pointer = document.querySelector('.wheel-pointer');
                if(pointer) {
                    pointer.classList.add('tick');
                    setTimeout(() => pointer.classList.remove('tick'), 50);
                }
            } catch(e) {}
        }

        // Tam %10 Yeşil, %45 Kırmızı, %45 Siyah oranı (20 dilimde 2 Yeşil)
        const rouletteSlots = ['green', 'red', 'black', 'red', 'black', 'red', 'black', 'red', 'black', 'red', 'green', 'black', 'red', 'black', 'red', 'black', 'red', 'black', 'red', 'black'];
        
        const modeNames = {
            'normal': 'Hızlı (Rastgele)',
            'skill': 'Beceriye Göre',
            'wheel': 'Çarkıfelek',
            'dice': 'Zar Masası',
            'roulette': 'Rulet'
        };

        const diceRotations = [
            { x: 0, y: 0 }, { x: -90, y: 0 }, { x: 0, y: -90 }, { x: 0, y: 90 }, { x: 90, y: 0 }, { x: 180, y: 0 }
        ];

        const initialNames = ["Samet", "Rafet", "Kerim", "Feyzi", "Tolu", "Cio", "Zeynel", "Emre", "Gazi", "Ayşe"];
        
        function init() {
            initialNames.forEach(name => participants.push({ id: genId(), name: name, rating: 5 }));
            teams.push({ id: genId(), name: "Terrorists", color: "var(--team-3)" });
            teams.push({ id: genId(), name: "Counter-Terrorists", color: "var(--team-1)" });
            renderInputs();
        }

        function genId() { return Math.random().toString(36).substr(2, 9); }

        function changeTheme(color) {
            document.documentElement.style.setProperty('--accent', color);
        }

        function toggleDarkMode() {
            const body = document.body;
            body.classList.toggle('light-mode');
            const btn = document.getElementById('darkModeToggle');
            if(body.classList.contains('light-mode')) {
                btn.innerText = '🌙';
            } else {
                btn.innerText = '☀️';
            }
        }

        function getRatingColor(rating) {
            if (rating === 10) return '#ef4444'; // Kırmızı
            if (rating === 9 || rating === 8) return '#f97316'; // Turuncu
            if (rating >= 4 && rating <= 7) return '#eab308'; // Sarı
            if (rating === 3 || rating === 2) return '#22c55e'; // Yeşil
            return '#f8fafc'; // Beyaz (1. Seviye)
        }

        function setMode(newMode) {
            mode = newMode;

                input.oninput = (e) => t.name = e.target.value;

                const delBtn = document.createElement('button');

                delBtn.innerHTML = '✖';

                row.appendChild(delBtn);

        function addParticipant() { participants.push({ id: genId(), name: "Yeni Oyuncu", rating: 5 }); renderInputs(); }
        function addTeam() { teams.push({ id: genId(), name: `Takım ${teams.length+1}`, color: "var(--team-4)" }); renderInputs(); }

        function startGeneration() {
            const validP = participants.filter(p => p.name.trim() !== "");
            if(validP.length < teams.length) return alert("Oyuncu sayısı takım sayısından az olamaz!");
            if(teams.length < 2) return alert("En az 2 takım olmalı!");
            if(mode === 'roulette' && teams.length !== 2) return alert("Rulet modu tam olarak 2 takım gerektirir! Lütfen takım sayısını 2'ye ayarlayın.");

            const navModes = document.getElementById('nav-modes');
            navModes.style.pointerEvents = 'none';
            navModes.style.opacity = '0.3';
            
            const themeSwitch = document.getElementById('theme-switcher');
            themeSwitch.style.pointerEvents = 'none';
            themeSwitch.style.opacity = '0.3';

            document.getElementById('main-inputs').style.display = 'none';

            if(mode === 'normal' || mode === 'skill') {
                generateInstant(validP);
            } else if (mode === 'wheel') {
                initWheel(validP);
            } else if (mode === 'dice') {
                initDice(validP);
            } else if (mode === 'roulette') {
                initRoulette(validP);
            }
        }

        // 1. HIZLI DAĞITIM
        function generateInstant(validP) {
            const forceEqual = document.getElementById('forceEqual').checked;
            const maxPerTeam = Math.ceil(validP.length / teams.length);

            let finalTeams = teams.map(t => ({ ...t, members: [], score: 0 }));
            let pool = [...validP];

            if(mode === 'normal') {
                pool.sort(() => Math.random() - 0.5);
                if(forceEqual) {
                    pool.forEach((p, i) => finalTeams[i % finalTeams.length].members.push(p));
                } else {
                    pool.forEach(p => finalTeams[Math.floor(Math.random() * finalTeams.length)].members.push(p));
                }
            } else {
                // Aynı puandaki oyuncuların sırasını rastgele yapmak için önce genel karıştırma
                pool.sort(() => Math.random() - 0.5);
                pool.sort((a,b) => b.rating - a.rating);
                
                if(forceEqual) {
                    pool.forEach(p => {
                        let availableTeams = finalTeams.filter(t => t.members.length < maxPerTeam);
                        if(availableTeams.length === 0) availableTeams = finalTeams;
                        
                        let minScore = Math.min(...availableTeams.map(t => t.score));
                        let candidates = availableTeams.filter(t => t.score === minScore);
                        let chosenTeam = candidates[Math.floor(Math.random() * candidates.length)];
                        
                        chosenTeam.members.push(p);
                        chosenTeam.score += p.rating;
                    });
                } else {
                    pool.forEach(p => {
                        let minScore = Math.min(...finalTeams.map(t => t.score));
                        let candidates = finalTeams.filter(t => t.score === minScore);
                        let chosenTeam = candidates[Math.floor(Math.random() * candidates.length)];
                        
                        chosenTeam.members.push(p);
                        chosenTeam.score += p.rating;
                    });
                }
            }
            renderTeamsGrid(finalTeams, 'final-teams-grid', mode === 'skill');
            document.getElementById('results-screen').style.display = 'block';
        }

        // 2. ÇARKIFELEK
        let currentAngle = 0;
        let spinSpeed = 0;
        const wheelColors = ['#3b82f6', '#f43f5e', '#eab308', '#a855f7', '#00e676'];

        function initWheel(validP) {
            document.getElementById('wheel-screen').style.display = 'block';
            draftPlayers = [...validP].sort(() => Math.random() - 0.5);
            draftTeams = teams.map(t => ({ ...t, members: [] }));
            currentTeamIndex = 0;
            document.getElementById('wheel-team-select').innerHTML = ''; // Yeni kura için menüyü sıfırla
            updateWheelUI();
            drawWheel();
        }

        function drawWheel() {
            const canvas = document.getElementById('wheel-canvas');
            if(!canvas || draftPlayers.length === 0) return;
            const ctx = canvas.getContext('2d');
            const arc = Math.PI * 2 / draftPlayers.length;
            ctx.clearRect(0,0,450,450);
            
            for(let i=0; i<draftPlayers.length; i++) {
                const angle = currentAngle + i * arc;
                ctx.beginPath();
                ctx.fillStyle = wheelColors[i % wheelColors.length];
                if(i === draftPlayers.length-1 && draftPlayers.length % wheelColors.length === 1 && draftPlayers.length > 1) ctx.fillStyle = '#ff7a00';
                ctx.moveTo(225, 225);
                ctx.arc(225, 225, 220, angle, angle + arc);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(225, 225);
                ctx.rotate(angle + arc/2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 18px Poppins';
                ctx.fillText(draftPlayers[i].name, 200, 6);
                ctx.restore();
            }
            ctx.beginPath(); ctx.arc(225,225,20,0,Math.PI*2); ctx.fillStyle="#1e293b"; ctx.fill();
        }

        function spinWheel() {
            if(isAnimating || draftPlayers.length === 0) return;
            isAnimating = true;
            
            const selectEl = document.getElementById('wheel-team-select');
            activeWheelMode = selectEl.value;
            selectEl.disabled = true; // Kura sırasında değiştirmeyi engelle

            initAudio();
            lastTick = Math.floor(currentAngle / (Math.PI * 2 / draftPlayers.length));

            document.getElementById('spinBtn').disabled = true;
            spinSpeed = Math.random() * 0.15 + 0.20; 
            requestAnimationFrame(animateWheel);
        }

        function animateWheel() {
            currentAngle += spinSpeed;
            if (spinSpeed < 0.02) {
                spinSpeed *= 0.993; // Dramatik yavaşlama (kılpayı süzülmesi)
            } else {
                spinSpeed *= 0.985;
            }
            drawWheel();
            
            let arc = 2 * Math.PI / draftPlayers.length;
            let currentTick = Math.floor(currentAngle / arc);
            if(currentTick !== lastTick) {
                playTick();
                lastTick = currentTick;
            }
            
            if(spinSpeed < 0.001) {
                let normalized = currentAngle % (2 * Math.PI);
                if(normalized < 0) normalized += 2 * Math.PI;
                let winIdx = Math.floor((2 * Math.PI - normalized) / arc) % draftPlayers.length;
                
                let winner = draftPlayers[winIdx];
                document.getElementById('spinBtn').innerText = `${winner.name} Geldi! Bekleniyor...`;
                
                setTimeout(() => {
                    let targetTeamIdx;
                    if (activeWheelMode === 'auto') {
                        targetTeamIdx = currentTeamIndex;
                        currentTeamIndex = (currentTeamIndex + 1) % draftTeams.length;
                    } else {
                        targetTeamIdx = parseInt(activeWheelMode);
                    }
                    draftTeams[targetTeamIdx].members.push(winner);
                    draftPlayers.splice(winIdx, 1);
                    
                    updateWheelUI();
                    drawWheel();

                    if(draftPlayers.length === 0) {
                        document.getElementById('spinBtn').innerText = "Kura Bitti!";
                        isAnimating = false;
                    } else {
                        isAnimating = false;
                        document.getElementById('spinBtn').disabled = false;
                        document.getElementById('spinBtn').innerText = "Çarkı Çevir";
                    }
                }, 1000); 
            } else {
                requestAnimationFrame(animateWheel);
            }
        }

        function checkWheelAutoAssign() {
            if (draftPlayers.length === 0 || draftTeams.length !== 2) return false;
            
            const totalPlayers = draftPlayers.length + draftTeams[0].members.length + draftTeams[1].members.length;
            const maxPerTeam = Math.ceil(totalPlayers / 2);
            
            if (draftTeams[0].members.length >= maxPerTeam) {
                draftTeams[1].members.push(...draftPlayers);
                draftPlayers = [];
                return true;
            }
            if (draftTeams[1].members.length >= maxPerTeam) {
                draftTeams[0].members.push(...draftPlayers);
                draftPlayers = [];
                return true;
            }
            return false;
        }

        function updateWheelUI() {
            const wasAutoAssigned = checkWheelAutoAssign();

            const statusText = document.getElementById('wheel-status-text');
            const selectEl = document.getElementById('wheel-team-select');

            if(draftPlayers.length > 0) {
                statusText.innerText = "Dağıtım Modu:";
                selectEl.style.display = 'inline-block';
                selectEl.disabled = false;

        function rollDice() {
            if(isAnimating || draftPlayers.length === 0) return;

            const selectEl = document.getElementById('dice-player-select');
            activeDicePlayerIndex = parseInt(selectEl.value);

            for(let i=0; i<6; i++) teamFaces.push(draftTeams[i % draftTeams.length]);

                    isAnimating = false;

        function drawRouletteWheel() {
            const canvas = document.getElementById('roulette-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = cx;
            const numSlots = rouletteSlots.length;
            const arc = Math.PI * 2 / numSlots;

            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            for(let i=0; i<numSlots; i++) {
                const angle = wheelAngle + i * arc;
                ctx.beginPath();
                if(rouletteSlots[i] === 'green') ctx.fillStyle = '#16a34a';
                else if(rouletteSlots[i] === 'red') ctx.fillStyle = '#dc2626';
                else ctx.fillStyle = '#111827';
                
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, angle, angle + arc);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Dilimler küçüldüğü için sadece yeşillere yıldız koyalım, temiz görünsün
                if(rouletteSlots[i] === 'green') {
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(angle + arc/2);
                    ctx.textAlign = 'right';
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px Poppins';
                    ctx.fillText('★', radius - 8, 5);
                    ctx.restore();
                }
            }
            
            // Rulet Masası İç Kısımları
            ctx.beginPath(); ctx.arc(cx, cy, radius * 0.65, 0, Math.PI*2); 
            ctx.fillStyle = '#1e293b'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#eab308'; ctx.stroke();
            
            ctx.beginPath(); ctx.arc(cx, cy, radius * 0.25, 0, Math.PI*2); 
            ctx.fillStyle = '#33201c'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.stroke();
            
            ctx.beginPath(); ctx.arc(cx, cy, radius * 0.1, 0, Math.PI*2); 
            ctx.fillStyle = '#eab308'; ctx.fill();
            
            // Top Çizimi (Hızına Göre İçe Doğru Süzülür)
            let speedFactor = Math.min(ballSpinSpeed / 0.15, 1);
            let currentBallRadius = radius * 0.70 + (radius * 0.20 * speedFactor);
            
            const bx = cx + Math.cos(ballAngle) * currentBallRadius;
            const by = cy + Math.sin(ballAngle) * currentBallRadius;
            
            ctx.beginPath();
            ctx.arc(bx, by, 7, 0, Math.PI*2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#333';
            ctx.stroke();
        }

        function spinRoulette() {
            if(isAnimating || draftPlayers.length === 0) return;
            isAnimating = true;
            
            const selectEl = document.getElementById('roulette-player-select');
            activeRoulettePlayerIndex = parseInt(selectEl.value);
            selectEl.disabled = true; // Kura sırasında değiştirmeyi engelle

            const btn = document.getElementById('roulette-roll-btn');
            btn.disabled = true;
            btn.innerText = "Dönüyor...";
            
            ballSpinSpeed = Math.random() * 0.15 + 0.35; // Top hızlı bir şekilde fırlar
            requestAnimationFrame(animateRoulette);
            
            try {
                sfxRoulette.currentTime = 0;
                sfxRoulette.play();
            } catch(e) {}
        }

        function animateRoulette() {
            wheelAngle -= 0.005; // Masa sürekli olarak yavaşça saat yönünün tersine döner
            ballAngle += ballSpinSpeed; // Top saat yönünde hızlıca döner
            ballSpinSpeed *= 0.991; // Animasyonu daha da uzatıyoruz (Sesle tam senkron)
            
            drawRouletteWheel();
            
            if(ballSpinSpeed < 0.001) {
                try { sfxRoulette.pause(); } catch(e) {} // Animasyon bittiğinde sesi kesin olarak kes
                let relativeAngle = (ballAngle - wheelAngle) % (2 * Math.PI);
                if(relativeAngle < 0) relativeAngle += 2 * Math.PI;
                let arc = 2 * Math.PI / rouletteSlots.length;
                let winIdx = Math.floor(relativeAngle / arc) % rouletteSlots.length;
                
                let winnerColor = rouletteSlots[winIdx];
                handleRouletteResult(winnerColor);
            } else {
                requestAnimationFrame(animateRoulette);
            }
        }

        function handleRouletteResult(color) {
            const btn = document.getElementById('roulette-roll-btn');
            
            if(color === 'black') {
                btn.innerText = `Siyah! ${draftTeams[0].name} Kazandı.`;
                setTimeout(() => { finishRouletteTurn(0); }, 2000);
            } else if (color === 'red') {
                btn.innerText = `Kırmızı! ${draftTeams[1].name} Kazandı.`;
                setTimeout(() => { finishRouletteTurn(1); }, 2000);
            } else if (color === 'green') {
                document.getElementById('roulette-controls').style.display = 'none';
                const choiceBox = document.getElementById('roulette-choice');
                choiceBox.style.display = 'flex';
                choiceBox.innerHTML = `
                    <div style="width:100%; text-align:center; color:#16a34a; font-weight:800; font-size:24px; text-transform:uppercase; letter-spacing:1px;">Yeşil Geldi! Takımını Seç:</div>
                    <button class="start-btn" style="margin:0; width:auto; flex:1; background:var(--panel-bg); color:white; border:3px solid ${draftTeams[0].color || '#3b82f6'}" onclick="finishRouletteTurn(0)">${draftTeams[0].name}</button>
                    <button class="start-btn" style="margin:0; width:auto; flex:1; background:var(--panel-bg); color:white; border:3px solid ${draftTeams[1].color || '#f43f5e'}" onclick="finishRouletteTurn(1)">${draftTeams[1].name}</button>
                `;
            }
        }

        function finishRouletteTurn(teamIndex) {
            draftTeams[teamIndex].members.push(draftPlayers[activeRoulettePlayerIndex]);
            draftPlayers.splice(activeRoulettePlayerIndex, 1);
            isAnimating = false;
            updateRouletteUI();
        }

        // ORTAK UI METODU
        function renderTeamsGrid(teamsArray, containerId, showScores) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            
            teamsArray.forEach(t => {
                const card = document.createElement('div');
                card.className = 'team-card';
                if(t.color) card.style.borderTopColor = t.color;

                const scoreHtml = showScores ? `<div class="team-stats">Toplam Güç: ${t.score}</div>` : `<div class="team-stats">${t.members.length} Kişi</div>`;
                
                let membersHtml = t.members.map(m => `
                    <li>
                        <span>${m.name}</span>
                        ${showScores ? `<span class="p-rating" style="color:${getRatingColor(m.rating)}">${m.rating} Puan</span>` : ''}
                    </li>
                `).join('');

                card.innerHTML = `
                    <div class="team-header">
                        <h3>${t.name}</h3>
                        ${scoreHtml}
                    </div>
                    <ul class="team-members">
                        ${membersHtml}
                    </ul>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
