<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sports Takım Karıştırıcı</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #00e676;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --team-1: #3b82f6;
            --team-2: #f43f5e;
            --team-3: #eab308;
            --team-4: #a855f7;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background-color 0.3s; }

        /* HEADER & MENÜ */
        .header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: 0.2s; width: 250px; }
        .logo:hover { text-shadow: 0 0 10px var(--accent); }
        
        /* TEMA SEÇİCİ */
        .theme-switcher { display: flex; gap: 10px; justify-content: center; flex: 1; }
        .theme-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .theme-dot:hover { transform: scale(1.3); }

        .nav-modes { display: flex; gap: 10px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 8px; transition: opacity 0.3s; justify-content: flex-end; width: 450px; }
        .mode-btn { background: transparent; color: var(--text-muted); border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; font-size: 13px; }
        .mode-btn.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        .mode-btn:hover:not(.active) { color: var(--text-main); background: rgba(255,255,255,0.05); }

        /* ANA KONTEYNER */
        .container { max-width: 1300px; margin: 40px auto; padding: 0 20px; width: 100%; flex: 1; }
        
        /* GİRİŞ EKRANI */
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .panel { background: var(--panel-bg); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .panel h2 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; font-size: 20px; color: var(--accent); border-bottom: 2px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        
        .row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; transition: transform 0.2s; }
        .row:hover { transform: scale(1.015); }
        .input-text { flex: 1; background: transparent; border: none; color: white; font-size: 16px; outline: none; }
        .btn-icon { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: none; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; transition: 0.2s; }
        .btn-icon:hover { background: var(--danger); color: white; }
        
        /* ÖZEL SEVİYE KUTUCUKLARI (1-10) */
        .rating-dots { display: flex; gap: 4px; }
        .rating-box { width: 22px; height: 22px; border-radius: 4px; background: rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: var(--text-muted); user-select: none; border: 1px solid rgba(255,255,255,0.1); }
        .rating-box.active { color: #000; border-color: transparent; }

        .btn-add { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 2px dashed rgba(255,255,255,0.2); color: var(--text-muted); font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-add:hover { background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.4); }

        .start-btn { display: block; width: 100%; max-width: 400px; margin: 40px auto; padding: 20px; background: var(--accent); border: none; border-radius: 30px; font-size: 20px; font-weight: 800; color: #000; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.2s, box-shadow 0.2s; }
        .start-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px var(--accent); }
        .start-btn:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 20px; color: var(--text-muted); cursor: pointer; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }

        /* ÇARKIFELEK & ZAR ORTAK */
        .stage-screen { display: none; text-align: center; }
        .stage-title { font-size: 32px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* ÇARKIFELEK */
        .wheel-container { position: relative; width: 450px; height: 450px; margin: 0 auto 30px auto; }
        .wheel-pointer { position: absolute; top: 50%; right: -10px; transform: translateY(-50%); border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-right: 35px solid #fff; z-index: 10; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
        
        /* ZAR MODU */
        .dice-layout { display: flex; flex-direction: column; gap: 40px; margin-top: 20px; align-items: center; }
        .table-zone { background: radial-gradient(circle, #2a3b2c 0%, #0f172a 70%); border: 3px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; max-width: 600px; }
        
        /* 3D ZAR */
        .scene { width: 120px; height: 120px; perspective: 600px; margin: 20px 0; }
        .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: translateZ(-60px); transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .cube.rolling { animation: spinCube 0.5s linear infinite; }
        
        .cube-face { position: absolute; width: 120px; height: 120px; background: white; border: 2px solid #ccc; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: bold; color: #1e293b; box-shadow: inset 0 0 15px rgba(0,0,0,0.2); text-align: center; padding: 5px; word-wrap: break-word; }
        
        .front  { transform: rotateY(  0deg) translateZ(60px); }
        .right  { transform: rotateY( 90deg) translateZ(60px); }
        .back   { transform: rotateY(180deg) translateZ(60px); }
        .left   { transform: rotateY(-90deg) translateZ(60px); }
        .top    { transform: rotateX( 90deg) translateZ(60px); }
        .bottom { transform: rotateX(-90deg) translateZ(60px); }

        @keyframes spinCube {
            0% { transform: translateZ(-60px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: translateZ(-60px) rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
        }

        /* CANLI TAKIMLAR / SONUÇ EKRANI */
        .teams-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; width: 100%; }
        .team-card { background: var(--panel-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.4); border-top: 4px solid var(--accent); text-align: left; }
        .team-header { background: rgba(0,0,0,0.2); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .team-header h3 { margin: 0; color: #fff; }
        .team-stats { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px; }
        .team-members { list-style: none; padding: 0; margin: 0; }
        .team-members li { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.5s ease; }
        .team-members li:last-child { border-bottom: none; }
        .p-rating { font-weight: 800; font-size: 14px; text-shadow: 0 0 5px rgba(0,0,0,0.5); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo" id="logo-text" onclick="resetToMenu()" title="Ayar Ekranına Dön">Beceriye Göre</div>
        
        <!-- Renk / Tema Seçici -->
        <div class="theme-switcher" id="theme-switcher">
            <div class="theme-dot" style="background: #00e676;" onclick="changeTheme('#00e676')"></div> <!-- Yeşil -->
            <div class="theme-dot" style="background: #3b82f6;" onclick="changeTheme('#3b82f6')"></div> <!-- Mavi -->
            <div class="theme-dot" style="background: #a855f7;" onclick="changeTheme('#a855f7')"></div> <!-- Mor -->
            <div class="theme-dot" style="background: #ef4444;" onclick="changeTheme('#ef4444')"></div> <!-- Kırmızı -->
            <div class="theme-dot" style="background: #f97316;" onclick="changeTheme('#f97316')"></div> <!-- Turuncu -->
        </div>

        <div class="nav-modes" id="nav-modes">
            <button class="mode-btn" id="btnNormal" onclick="setMode('normal')">Hızlı (Rastgele)</button>
            <button class="mode-btn active" id="btnSkill" onclick="setMode('skill')">Beceriye Göre</button>
            <button class="mode-btn" id="btnWheel" onclick="setMode('wheel')">Çarkıfelek</button>
            <button class="mode-btn" id="btnDice" onclick="setMode('dice')">Zar Masası</button>
        </div>
    </div>

    <div class="container" id="main-inputs">
        <div class="setup-grid">
            <!-- Sol: Katılımcılar -->
            <div class="panel">
                <h2>Katılımcılar <span id="playerCount" style="font-size:14px; background: rgba(255,255,255,0.1); color:var(--accent); padding:2px 8px; border-radius:10px;">0</span></h2>
                <div id="participants-list"></div>
                <button class="btn-add" onclick="addParticipant()">+ Yeni Oyuncu Ekle</button>
            </div>

            <!-- Sağ: Takımlar -->
            <div class="panel">
                <h2>Takımlar <span id="teamCountBadge" style="font-size:14px; background: rgba(255,255,255,0.1); color:var(--accent); padding:2px 8px; border-radius:10px;">0</span></h2>
                <div id="teams-list"></div>
                <button class="btn-add" onclick="addTeam()">+ Yeni Takım Ekle</button>
            </div>
        </div>
        
        <label class="checkbox-group" id="forceEqualContainer">
            <input type="checkbox" id="forceEqual" checked>
            Eşit Oyuncu Sayısına Zorla (Örn: 5v5 Dağılım)
        </label>

        <button class="start-btn" onclick="startGeneration()">Eşleştirmeyi Başlat</button>
    </div>

    <!-- ÇARKIFELEK EKRANI -->
    <div class="container stage-screen" id="wheel-screen">
        <div class="stage-title">Sıradaki Takım: <span id="wheel-team-name" style="color:var(--accent);">Takım 1</span></div>
        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <canvas id="wheel-canvas" width="450" height="450"></canvas>
        </div>
        <button class="start-btn" id="spinBtn" style="margin-top:0;" onclick="spinWheel()">Çarkı Çevir</button>
        <div id="wheel-teams-grid" class="teams-grid"></div>
    </div>

    <!-- ZAR EKRANI -->
    <div class="container stage-screen" id="dice-screen">
        <div class="stage-title" style="color:var(--accent);">Zar Masası</div>
        
        <div class="dice-layout">
            <div class="table-zone">
                <div id="dice-player-name" style="font-size: 24px; font-weight: bold; margin-bottom: -10px;">Sıradaki: -</div>
                
                <div class="scene">
                    <div class="cube" id="dice-cube">
                        <div class="cube-face front" id="face-0">T1</div>
                        <div class="cube-face back" id="face-5">T2</div>
                        <div class="cube-face right" id="face-2">T1</div>
                        <div class="cube-face left" id="face-3">T2</div>
                        <div class="cube-face top" id="face-1">T1</div>
                        <div class="cube-face bottom" id="face-4">T2</div>
                    </div>
                </div>
                
                <button class="start-btn" id="dice-roll-btn" style="margin: 0; padding: 15px 40px; font-size:18px;" onclick="rollDice()">Zarı At</button>
            </div>

            <div id="dice-teams-grid" class="teams-grid"></div>
        </div>
    </div>

    <!-- HIZLI SONUÇ EKRANI -->
    <div class="container stage-screen" id="results-screen">
        <div class="stage-title" style="color:var(--accent);">Kadro Tamamlandı!</div>
        <div id="final-teams-grid" class="teams-grid"></div>
        <!-- Sayfa yenilemek yerine ayarlara geri döndüren buton -->
        <button class="start-btn" onclick="resetToMenu()" style="margin-top:40px; background:var(--panel-bg); color:white; border: 1px solid rgba(255,255,255,0.2); box-shadow:none;">Yeni Karışım Yap</button>
    </div>

    <script>
        let mode = 'skill'; 
        let participants = [];
        let teams = [];
        
        let draftPlayers = [];
        let draftTeams = [];
        let currentTeamIndex = 0;
        let isAnimating = false;
        
        const modeNames = {
            'normal': 'Hızlı (Rastgele)',
            'skill': 'Beceriye Göre',
            'wheel': 'Çarkıfelek',
            'dice': 'Zar Masası'
        };

        const diceRotations = [
            { x: 0, y: 0 }, { x: -90, y: 0 }, { x: 0, y: -90 }, { x: 0, y: 90 }, { x: 90, y: 0 }, { x: 180, y: 0 }
        ];

        const initialNames = ["Samet", "Rafet", "Kerim", "Feyzi", "Tolu", "Cio", "Zeynel", "Emre", "Gazi", "Ayşe"];
        
        function init() {
            initialNames.forEach(name => participants.push({ id: genId(), name: name, rating: 5 }));
            teams.push({ id: genId(), name: "Terrorists", color: "var(--team-3)" });
            teams.push({ id: genId(), name: "Counter-Terrorists", color: "var(--team-1)" });
            renderInputs();
        }

        function genId() { return Math.random().toString(36).substr(2, 9); }

        function changeTheme(color) {
            document.documentElement.style.setProperty('--accent', color);
        }

        function getRatingColor(rating) {
            if (rating === 10) return '#ef4444'; // Kırmızı
            if (rating === 9 || rating === 8) return '#f97316'; // Turuncu
            if (rating >= 4 && rating <= 7) return '#eab308'; // Sarı
            if (rating === 3 || rating === 2) return '#22c55e'; // Yeşil
            return '#f8fafc'; // Beyaz (1. Seviye)
        }

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
            
            document.getElementById('logo-text').innerText = modeNames[mode];

            if(mode === 'normal' || mode === 'skill') {
                document.getElementById('forceEqualContainer').style.display = 'flex';
            } else {
                document.getElementById('forceEqualContainer').style.display = 'none';
            }

            renderInputs();
        }

        // Seçimleri silmeden ana menüye dönmeyi sağlayan fonksiyon
        function resetToMenu() {
            // Animasyon devam ediyorsa menüye dönmeyi engelle
            if(isAnimating) return; 

            document.getElementById('wheel-screen').style.display = 'none';
            document.getElementById('dice-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'none';
            
            document.getElementById('main-inputs').style.display = 'block';

            const navModes = document.getElementById('nav-modes');
            navModes.style.pointerEvents = 'auto';
            navModes.style.opacity = '1';
            
            const themeSwitch = document.getElementById('theme-switcher');
            themeSwitch.style.pointerEvents = 'auto';
            themeSwitch.style.opacity = '1';
        }

        function renderInputs() {
            const pList = document.getElementById('participants-list');
            pList.innerHTML = '';
            document.getElementById('playerCount').innerText = participants.length;
            
            participants.forEach(p => {
                const row = document.createElement('div');
                row.className = 'row';
                
                const input = document.createElement('input');
                input.className = 'input-text';
                input.value = p.name;
                input.oninput = (e) => p.name = e.target.value;
                
                const ratingDiv = document.createElement('div');
                ratingDiv.className = 'rating-dots';
                if(mode !== 'skill') ratingDiv.style.opacity = '0.2'; 
                
                for(let i=1; i<=10; i++) {
                    const dot = document.createElement('div');
                    dot.className = `rating-box ${i <= p.rating ? 'active' : ''}`;
                    dot.innerText = i; // İçine rakam yazdırıldı
                    
                    if (i <= p.rating) {
                        const color = getRatingColor(p.rating);
                        dot.style.background = color;
                        dot.style.boxShadow = `0 0 6px ${color}`;
                    }

                    if(mode === 'skill') dot.onclick = () => { p.rating = i; renderInputs(); };
                    ratingDiv.appendChild(dot);
                }

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-icon';
                delBtn.innerHTML = '✖';
                delBtn.onclick = () => { participants = participants.filter(x => x.id !== p.id); renderInputs(); };

                row.appendChild(input);
                row.appendChild(ratingDiv);
                row.appendChild(delBtn);
                pList.appendChild(row);
            });

            const tList = document.getElementById('teams-list');
            tList.innerHTML = '';
            document.getElementById('teamCountBadge').innerText = teams.length;

            teams.forEach((t) => {
                const row = document.createElement('div');
                row.className = 'row';
                
                const input = document.createElement('input');
                input.className = 'input-text';
                input.value = t.name;
                input.oninput = (e) => t.name = e.target.value;

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-icon';
                delBtn.innerHTML = '✖';
                delBtn.onclick = () => { teams = teams.filter(x => x.id !== t.id); renderInputs(); };

                row.appendChild(input);
                row.appendChild(delBtn);
                tList.appendChild(row);
            });
        }

        function addParticipant() { participants.push({ id: genId(), name: "Yeni Oyuncu", rating: 5 }); renderInputs(); }
        function addTeam() { teams.push({ id: genId(), name: `Takım ${teams.length+1}`, color: "var(--team-4)" }); renderInputs(); }

        function startGeneration() {
            const validP = participants.filter(p => p.name.trim() !== "");
            if(validP.length < teams.length) return alert("Oyuncu sayısı takım sayısından az olamaz!");
            if(teams.length < 2) return alert("En az 2 takım olmalı!");

            const navModes = document.getElementById('nav-modes');
            navModes.style.pointerEvents = 'none';
            navModes.style.opacity = '0.3';
            
            const themeSwitch = document.getElementById('theme-switcher');
            themeSwitch.style.pointerEvents = 'none';
            themeSwitch.style.opacity = '0.3';

            document.getElementById('main-inputs').style.display = 'none';

            if(mode === 'normal' || mode === 'skill') {
                generateInstant(validP);
            } else if (mode === 'wheel') {
                initWheel(validP);
            } else if (mode === 'dice') {
                initDice(validP);
            }
        }

        // 1. HIZLI DAĞITIM
        function generateInstant(validP) {
            const forceEqual = document.getElementById('forceEqual').checked;
            const maxPerTeam = Math.ceil(validP.length / teams.length);

            let finalTeams = teams.map(t => ({ ...t, members: [], score: 0 }));
            let pool = [...validP];

            if(mode === 'normal') {
                pool.sort(() => Math.random() - 0.5);
                if(forceEqual) {
                    pool.forEach((p, i) => finalTeams[i % finalTeams.length].members.push(p));
                } else {
                    pool.forEach(p => finalTeams[Math.floor(Math.random() * finalTeams.length)].members.push(p));
                }
            } else {
                pool.sort((a,b) => b.rating - a.rating);
                if(forceEqual) {
                    pool.forEach(p => {
                        let availableTeams = finalTeams.filter(t => t.members.length < maxPerTeam);
                        if(availableTeams.length === 0) availableTeams = finalTeams;
                        availableTeams.sort((a,b) => a.score - b.score);
                        availableTeams[0].members.push(p);
                        availableTeams[0].score += p.rating;
                    });
                } else {
                    pool.forEach(p => {
                        finalTeams.sort((a,b) => a.score - b.score);
                        finalTeams[0].members.push(p);
                        finalTeams[0].score += p.rating;
                    });
                }
            }
            renderTeamsGrid(finalTeams, 'final-teams-grid', mode === 'skill');
            document.getElementById('results-screen').style.display = 'block';
        }

        // 2. ÇARKIFELEK
        let currentAngle = 0;
        let spinSpeed = 0;
        const wheelColors = ['#3b82f6', '#f43f5e', '#eab308', '#a855f7', '#00e676'];

        function initWheel(validP) {
            document.getElementById('wheel-screen').style.display = 'block';
            draftPlayers = [...validP].sort(() => Math.random() - 0.5);
            draftTeams = teams.map(t => ({ ...t, members: [] }));
            currentTeamIndex = 0;
            updateWheelUI();
            drawWheel();
        }

        function drawWheel() {
            const canvas = document.getElementById('wheel-canvas');
            if(!canvas || draftPlayers.length === 0) return;
            const ctx = canvas.getContext('2d');
            const arc = Math.PI * 2 / draftPlayers.length;
            ctx.clearRect(0,0,450,450);
            
            for(let i=0; i<draftPlayers.length; i++) {
                const angle = currentAngle + i * arc;
                ctx.beginPath();
                ctx.fillStyle = wheelColors[i % wheelColors.length];
                if(i === draftPlayers.length-1 && draftPlayers.length % wheelColors.length === 1 && draftPlayers.length > 1) ctx.fillStyle = '#ff7a00';
                ctx.moveTo(225, 225);
                ctx.arc(225, 225, 220, angle, angle + arc);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(225, 225);
                ctx.rotate(angle + arc/2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 18px Poppins';
                ctx.fillText(draftPlayers[i].name, 200, 6);
                ctx.restore();
            }
            ctx.beginPath(); ctx.arc(225,225,20,0,Math.PI*2); ctx.fillStyle="#1e293b"; ctx.fill();
        }

        function spinWheel() {
            if(isAnimating || draftPlayers.length === 0) return;
            isAnimating = true;
            document.getElementById('spinBtn').disabled = true;
            spinSpeed = Math.random() * 0.15 + 0.20; 
            requestAnimationFrame(animateWheel);
        }

        function animateWheel() {
            currentAngle += spinSpeed;
            spinSpeed *= 0.985;
            drawWheel();
            if(spinSpeed < 0.002) {
                let normalized = currentAngle % (2 * Math.PI);
                if(normalized < 0) normalized += 2 * Math.PI;
                let arc = 2 * Math.PI / draftPlayers.length;
                let winIdx = Math.floor((2 * Math.PI - normalized) / arc) % draftPlayers.length;
                
                let winner = draftPlayers[winIdx];
                document.getElementById('spinBtn').innerText = `${winner.name} Geldi! Bekleniyor...`;
                
                setTimeout(() => {
                    draftTeams[currentTeamIndex].members.push(winner);
                    draftPlayers.splice(winIdx, 1);
                    currentTeamIndex = (currentTeamIndex + 1) % draftTeams.length;
                    
                    updateWheelUI();
                    drawWheel();

                    if(draftPlayers.length === 0) {
                        document.getElementById('spinBtn').innerText = "Kura Bitti!";
                        isAnimating = false;
                    } else {
                        isAnimating = false;
                        document.getElementById('spinBtn').disabled = false;
                        document.getElementById('spinBtn').innerText = "Çarkı Çevir";
                    }
                }, 3000); 
            } else {
                requestAnimationFrame(animateWheel);
            }
        }

        function updateWheelUI() {
            if(draftPlayers.length > 0) {
                document.getElementById('wheel-team-name').innerText = draftTeams[currentTeamIndex].name;
            } else {
                document.getElementById('wheel-team-name').innerText = "Tamamlandı!";
            }
            renderTeamsGrid(draftTeams, 'wheel-teams-grid', false);
        }

        // 3. ZAR MODU
        function initDice(validP) {
            document.getElementById('dice-screen').style.display = 'block';
            draftPlayers = [...validP].sort(() => Math.random() - 0.5); 
            draftTeams = teams.map(t => ({ ...t, members: [] }));
            
            for(let i=0; i<6; i++) {
                const team = draftTeams[i % draftTeams.length];
                document.getElementById(`face-${i}`).innerText = team.name;
            }
            
            updateDiceUI();
        }

        function updateDiceUI() {
            const nameEl = document.getElementById('dice-player-name');
            const btn = document.getElementById('dice-roll-btn');
            
            if(draftPlayers.length > 0) {
                nameEl.innerText = `Sıradaki: ${draftPlayers[0].name}`;
                btn.disabled = false;
                btn.innerText = "Zarı At";
            } else {
                nameEl.innerText = "Kura Tamamlandı!";
                btn.disabled = true;
                btn.innerText = "Bitti";
            }
            renderTeamsGrid(draftTeams, 'dice-teams-grid', false);
        }

        function rollDice() {
            if(isAnimating || draftPlayers.length === 0) return;
            isAnimating = true;
            
            const currentPlayer = draftPlayers[0];
            const btn = document.getElementById('dice-roll-btn');
            btn.disabled = true;
            btn.innerText = "Atılıyor...";
            
            const cube = document.getElementById('dice-cube');
            const diceFace = Math.floor(Math.random() * 6); 
            
            cube.style.transition = 'none';
            cube.classList.add('rolling');

            setTimeout(() => {
                cube.classList.remove('rolling');
                cube.style.transition = 'transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                
                const rot = diceRotations[diceFace];
                cube.style.transform = `translateZ(-60px) rotateX(${rot.x}deg) rotateY(${rot.y}deg)`;
                
                const tIndex = diceFace % draftTeams.length;
                const winnerTeam = draftTeams[tIndex];

                btn.innerText = `${winnerTeam.name} - Bekleniyor...`;
                
                setTimeout(() => {
                    winnerTeam.members.push(currentPlayer);
                    draftPlayers.shift(); 
                    
                    isAnimating = false;
                    updateDiceUI();
                }, 3000);

            }, 1000); 
        }

        // ORTAK UI METODU
        function renderTeamsGrid(teamsArray, containerId, showScores) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            
            teamsArray.forEach(t => {
                const card = document.createElement('div');
                card.className = 'team-card';
                if(t.color) card.style.borderTopColor = t.color;

                const scoreHtml = showScores ? `<div class="team-stats">Toplam Güç: ${t.score}</div>` : `<div class="team-stats">${t.members.length} Kişi</div>`;
                
                let membersHtml = t.members.map(m => `
                    <li>
                        <span>${m.name}</span>
                        ${showScores ? `<span class="p-rating" style="color:${getRatingColor(m.rating)}">${m.rating} Puan</span>` : ''}
                    </li>
                `).join('');

                card.innerHTML = `
                    <div class="team-header">
                        <h3>${t.name}</h3>
                        ${scoreHtml}
                    </div>
                    <ul class="team-members">
                        ${membersHtml}
                    </ul>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
